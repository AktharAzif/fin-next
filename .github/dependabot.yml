# Dependabot (spec 01 §3.7). A control path. The cooldown matches the workspace's
# minimumReleaseAge (three days); grouped moves follow FW-C18. Dependabot's pull requests run like
# a fork's (no secrets) and are reviewed like any other. Whether Dependabot can update a pnpm 12
# lockfile is SP-01's question: if it cannot, the npm entry goes and nightly.yml lists outdated
# packages instead. Images pinned inside workflow files and scripts (the Postgres service, the
# BuildKit builder) are not seen here; they move by hand with their package pins.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: daily }
    cooldown: { default-days: 3 }
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      tanstack: { patterns: ["@tanstack/*"] }
      better-auth: { patterns: ["better-auth", "@better-auth/*", "better-call"] }
      hono: { patterns: ["hono", "@hono/*"] }
      vite: { patterns: ["vite", "@vitejs/*", "@tailwindcss/vite", "tailwindcss"] }
      react: { patterns: ["react", "react-dom", "@types/react", "@types/react-dom"] }
      ui-sdk: { patterns: ["@ui-sdk/*"] }
      sentry: { patterns: ["@sentry/*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: daily }
    cooldown: { default-days: 3 }
  - package-ecosystem: docker
    directory: /ops/docker
    schedule: { interval: daily }
    cooldown: { default-days: 3 }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 3 }
