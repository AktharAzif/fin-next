# Dependency checks (spec 01 §5.5; ARCHITECTURE §11.2, §11.5; DECISIONS G-06). A control path.
# On pull requests that touch a manifest, the lockfile or the workspace policy, on every push to
# main, and daily: pnpm audit and its registry signatures, OSV-Scanner over the lockfile, and on
# pull requests GitHub's dependency review, which refuses GPL and AGPL licences. No caches: a scan
# reads what the registry serves today (ARCHITECTURE §11.3).
name: dependencies

on:
  pull_request:
    paths:
      - "**/package.json"
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/dependencies.yml
  push:
    branches: [main]
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependencies-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Start the clock
        run: echo "FIN_JOB_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (release asset, by checksum)
        run: .github/scripts/install-pnpm.sh
      - name: Install (no cache)
        run: pnpm install --frozen-lockfile
      - name: pnpm audit (fails on high and critical)
        run: pnpm audit --audit-level high
      - name: pnpm audit signatures
        run: pnpm audit signatures
      - name: ci.timing
        if: always()
        env:
          CI_JOB: audit
          CI_CACHE: miss
        run: echo "ci.timing job=${CI_JOB} ms=$(( $(date +%s%3N) - FIN_JOB_START_MS )) cache=${CI_CACHE}"

  osv:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Start the clock
        run: echo "FIN_JOB_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OSV-Scanner (release asset, by checksum)
        run: .github/scripts/install-tools.sh osv-scanner
      - name: OSV-Scanner over the lockfile
        run: osv-scanner scan source --lockfile pnpm-lock.yaml
      - name: ci.timing
        if: always()
        env:
          CI_JOB: osv
          CI_CACHE: miss
        run: echo "ci.timing job=${CI_JOB} ms=$(( $(date +%s%3N) - FIN_JOB_START_MS )) cache=${CI_CACHE}"

  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Start the clock
        run: echo "FIN_JOB_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - name: Dependency review (no GPL, no AGPL)
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          deny-licenses: GPL-1.0-only, GPL-1.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
          comment-summary-in-pr: never
          show-openssf-scorecard: false
      - name: ci.timing
        if: always()
        env:
          CI_JOB: review
          CI_CACHE: miss
        run: echo "ci.timing job=${CI_JOB} ms=$(( $(date +%s%3N) - FIN_JOB_START_MS )) cache=${CI_CACHE}"
